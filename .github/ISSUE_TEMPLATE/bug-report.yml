name: Bug report
description: Report a problem with a hook or composable.
title: "fix: "
labels:
  - bug
body:
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - React
        - Vue
        - Nuxt
        - TanStack Start
        - Other
    validations:
      required: true
  - type: input
    id: framework-version
    attributes:
      label: Framework version
      placeholder: "React 19.1.1, Vue 3.5.20, Nuxt 4.0.3"
    validations:
      required: true
  - type: input
    id: hook-name
    attributes:
      label: Hook or composable
      placeholder: useOnline
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 139, Safari 18
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link to a minimal reproduction or paste the smallest code sample that shows the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
